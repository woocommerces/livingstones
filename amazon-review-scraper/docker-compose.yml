version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amazon-review-scraper
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - APP_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=amazon_reviews
      - DB_USERNAME=${DB_USERNAME:-scraper}
      - DB_PASSWORD=${DB_PASSWORD:-scraper_password}
    volumes:
      - ./uploads:/var/www/html/uploads
      - ./logs:/var/www/html/logs
    depends_on:
      - mysql
    networks:
      - scraper-network

  mysql:
    image: mysql:5.7
    container_name: amazon-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password}
      - MYSQL_DATABASE=amazon_reviews
      - MYSQL_USER=${DB_USERNAME:-scraper}
      - MYSQL_PASSWORD=${DB_PASSWORD:-scraper_password}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "3307:3306"
    networks:
      - scraper-network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  cron:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amazon-cron
    restart: unless-stopped
    volumes:
      - ./uploads:/var/www/html/uploads
      - ./logs:/var/www/html/logs
    depends_on:
      - mysql
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=amazon_reviews
      - DB_USERNAME=${DB_USERNAME:-scraper}
      - DB_PASSWORD=${DB_PASSWORD:-scraper_password}
    networks:
      - scraper-network
    command: cron && tail -f /var/log/cron.log

volumes:
  mysql-data:

networks:
  scraper-network:
    driver: bridge
